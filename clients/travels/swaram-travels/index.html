<script>
(function(){
  "use strict";

  document.getElementById('year').textContent = new Date().getFullYear();

  /* ---------- Navbar scroll state ---------- */
  var nav = document.getElementById('siteNav');
  var onDarkThreshold = window.innerHeight * 0.7;
  function handleNavScroll(){
    if(window.scrollY > 40){ nav.classList.add('scrolled'); } else { nav.classList.remove('scrolled'); }
  }
  window.addEventListener('scroll', handleNavScroll, {passive:true});
  handleNavScroll();

  /* ---------- Mobile menu ---------- */
  var burger = document.getElementById('burgerBtn');
  var mobileMenu = document.getElementById('mobileMenu');
  var mobileClose = document.getElementById('mobileClose');
  function openMenu(){ mobileMenu.classList.add('open'); burger.setAttribute('aria-expanded','true'); document.body.style.overflow='hidden'; }
  function closeMenu(){ mobileMenu.classList.remove('open'); burger.setAttribute('aria-expanded','false'); document.body.style.overflow=''; }
  burger.addEventListener('click', openMenu);
  mobileClose.addEventListener('click', closeMenu);
  mobileMenu.querySelectorAll('a').forEach(function(a){ a.addEventListener('click', closeMenu); });

  /* ---------- Hero load-in ---------- */
  var hero = document.querySelector('.hero');
  window.addEventListener('load', function(){ hero.classList.add('loaded'); });

  /* ---------- Scroll reveal ---------- */
  var revealEls = document.querySelectorAll('.reveal, .reveal-scale, .process-item');
  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add('is-visible');
          io.unobserve(entry.target);
        }
      });
    }, {threshold:0.16, rootMargin:'0px 0px -60px 0px'});
    revealEls.forEach(function(el){ io.observe(el); });
  } else {
    revealEls.forEach(function(el){ el.classList.add('is-visible'); });
  }

  /* ---------- FAQ category tabs ---------- */
  document.querySelectorAll('.faq-tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      document.querySelectorAll('.faq-tab').forEach(function(t){ t.classList.remove('active'); t.setAttribute('aria-selected','false'); });
      tab.classList.add('active'); tab.setAttribute('aria-selected','true');
      var cat = tab.getAttribute('data-cat');
      document.querySelectorAll('.faq-item').forEach(function(item){
        var show = cat === 'all' || item.getAttribute('data-cat') === cat;
        item.classList.toggle('is-hidden', !show);
      });
    });
  });


  var travCount = document.getElementById('travCount');
  var count = 2;
  document.getElementById('travPlus').addEventListener('click', function(){
    count = Math.min(count+1, 20); travCount.textContent = count;
  });
  document.getElementById('travMinus').addEventListener('click', function(){
    count = Math.max(count-1, 1); travCount.textContent = count;
  });

  /* ---------- Plan form -> WhatsApp ---------- */
  document.getElementById('planForm').addEventListener('submit', function(e){
    e.preventDefault();
    var dest = document.getElementById('destInput').value || 'a destination we\'ll discuss';
    var date = document.getElementById('dateInput').value;
    var travellers = travCount.textContent;
    var msg = "Hi MyTrips Planner, I'd like to plan a trip to " + dest + ".";
    if(date){ msg += " Tentative travel date: " + date + "."; }
    msg += " Number of travellers: " + travellers + ".";
    window.open("https://wa.me/918086477654?text=" + encodeURIComponent(msg), "_blank", "noopener");
  });

  /* ---------- Horizontal rails: drag for every .rail (experiences + package rails) ---------- */
  document.querySelectorAll('.rail').forEach(function(rail){
    var isDown = false, startX, scrollLeft;
    rail.addEventListener('mousedown', function(e){
      isDown = true; rail.classList.add('dragging');
      startX = e.pageX - rail.offsetLeft; scrollLeft = rail.scrollLeft;
    });
    ['mouseleave','mouseup'].forEach(function(evt){
      rail.addEventListener(evt, function(){ isDown = false; rail.classList.remove('dragging'); });
    });
    rail.addEventListener('mousemove', function(e){
      if(!isDown) return;
      e.preventDefault();
      var x = e.pageX - rail.offsetLeft;
      rail.scrollLeft = scrollLeft - (x - startX) * 1.3;
    });
  });
  var experienceRail = document.getElementById('experienceRail');
  document.getElementById('railNext').addEventListener('click', function(){
    experienceRail.scrollBy({left: 340, behavior:'smooth'});
  });
  document.getElementById('railPrev').addEventListener('click', function(){
    experienceRail.scrollBy({left: -340, behavior:'smooth'});
  });

  /* ---------- Inspiration parallax (desktop only, reduced-motion safe) ---------- */
  var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var inspImgs = document.querySelectorAll('.insp-img');
  var inspStage = document.querySelector('.insp-stage');
  if(!prefersReduced && inspStage && window.innerWidth > 760){
    var ticking = false;
    function updateParallax(){
      var rect = inspStage.getBoundingClientRect();
      var vh = window.innerHeight;
      var progress = (vh - rect.top) / (vh + rect.height);
      inspImgs.forEach(function(el){
        var speed = parseFloat(el.getAttribute('data-speed')) || 0;
        var offset = (progress - 0.5) * 260 * speed * 10;
        el.style.transform = 'translateY(' + offset.toFixed(1) + 'px)';
      });
      ticking = false;
    }
    window.addEventListener('scroll', function(){
      if(!ticking){ window.requestAnimationFrame(updateParallax); ticking = true; }
    }, {passive:true});
    updateParallax();
  }

  /* ---------- Hero parallax zoom on scroll ---------- */
  var heroImg = document.getElementById('heroImg');
  if(!prefersReduced){
    window.addEventListener('scroll', function(){
      var y = window.scrollY;
      if(y < window.innerHeight){
        heroImg.style.transform = 'scale(' + (1.04 + y*0.00025) + ') translateY(' + (y*0.12) + 'px)';
      }
    }, {passive:true});
  }

  /* ---------- Magnetic buttons (desktop) ---------- */
  if(window.matchMedia('(hover: hover)').matches && !prefersReduced){
    document.querySelectorAll('.btn-primary, .btn-light').forEach(function(btn){
      btn.addEventListener('mousemove', function(e){
        var r = btn.getBoundingClientRect();
        var x = e.clientX - r.left - r.width/2;
        var y = e.clientY - r.top - r.height/2;
        btn.style.transform = 'translate(' + (x*0.18) + 'px,' + (y*0.35 - 3) + 'px)';
      });
      btn.addEventListener('mouseleave', function(){ btn.style.transform = ''; });
    });
  }

})();
</script>
