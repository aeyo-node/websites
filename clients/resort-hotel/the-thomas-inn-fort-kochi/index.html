<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>

    <meta name="keywords" content="The Thomas Inn, Resort Hotel Ernakulam, Hotel in Fort Kochi, Accommodation Kerala, Luxury Stay Ernakulam">
    
    <!-- Open Graph tags -->
    <meta property="og:title" content="The Thomas Inn (Fort Kochi) | Ernakulam, Kerala">
    <meta property="og:description" content="Relax and unwind at The Thomas Inn, your premier resort destination in the vibrant city of Ernakulam.">
    <meta property="og:image" content="images/hero_cover.jpg">

    <!-- External Style Files -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Tailwind CSS Engine -->

        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        luxury: {
                            50: '#FCFBF9',
                            100: '#FAF5EE',
                            200: '#F4ECE1',

                }

        }

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

      "address": {

        "addressLocality": "Ernakulam",
        "addressRegion": "Kerala",
        "addressCountry": "IN"

      "telephone": "N/A",

        "@type": "Rating",
        "ratingValue": "4.0"
      },
      "amenityFeature": [
        "Resort Facilities",
        "Comfortable Rooms"
      ]
    }

</head>
<body class="bg-[#FCFBF9] text-luxury-dark font-sans-luxury overflow-x-hidden antialiased">

            const [scrolled, setScrolled] = useState(false);

            const [bookingOpen, setBookingOpen] = useState(false);
            const [enquirySuccess, setEnquirySuccess] = useState(false);
            
            const rooms = [
                { id: 'standard', title: 'Standard Room', desc: 'Comfortable and cozy room perfect for short stays.', price: 'On Request', features: ['Queen Bed', 'Attached Bath', 'Wi-Fi'], image: 'images/room1.jpg' },

            const reviews = [
                { quote: "A wonderful stay in Fort Kochi. Great service and a peaceful environment.", author: "Satisfied Guest", role: "Traveler", rating: 5 },
                { quote: "The location is perfect for exploring the city. Very comfortable rooms.", author: "Happy Visitor", role: "Tourist", rating: 5 },
                { quote: "Excellent hospitality and a very pleasant resort experience.", author: "Frequent Traveler", role: "Guest", rating: 4 }

                                </a>
                                <nav className=\"hidden lg:flex items-center space-x-8\">

                            <p className=\"text-sm sm:text-lg text-luxury-200/90 font-light\">Experience comfort and relaxation in the heart of Fort Kochi.</p>

                            <p className=\"text-center text-luxury-600 max-w-3xl mx-auto\">The Thomas Inn (Fort Kochi) provides a serene retreat for travelers visiting Ernakulam. We pride ourselves on creating a comfortable, home-away-from-home atmosphere for all our guests.</p>

                    </section>

                    <section id=\"rooms\" className=\"py-24 bg-luxury-100\">
                        <div className=\"max-w-7xl mx-auto px-6\">

                            <div className=\"grid grid-cols-1 md:grid-cols-2 gap-8\">
                                {rooms.map(room => (
                                    <div key={room.id} className=\"bg-white p-8 rounded-3xl\">
                                        <h3 className=\"text-2xl font-serif-luxury mb-4\">{room.title}</h3>
                                        <p className=\"text-sm text-luxury-600 mb-4\">{room.desc}</p>

                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    <footer className=\"bg-luxury-dark text-white/50 py-16 text-center\">

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

</html>
