<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Thomas Inn - Resort Hotel in Fort Kochi, Ernakulam</title>
    
    <!-- SEO Optimization -->
    <meta name="description" content="The Thomas Inn is a resort hotel in Fort Kochi, Ernakulam, offering a heritage stay near Kochi's historic landmarks and waterfront.">
    <meta name="keywords" content="The Thomas Inn, Resort Hotel Fort Kochi, Heritage Hotel Ernakulam, Kochi Boutique Stay, Kerala Resort">
    
    <!-- Open Graph tags -->
    <meta property="og:title" content="The Thomas Inn - Resort Hotel in Fort Kochi, Ernakulam">
    <meta property="og:description" content="A heritage resort in the heart of Fort Kochi, blending colonial-era charm with modern amenities.">
    <meta property="og:image" content="images/hero_cover.jpg">
    <meta property="og:type" content="website">
    
    <!-- External Style Files -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        luxury: {
                            50: '#FCFBF9',
                            100: '#FAF5EE',
                            200: '#F4ECE1',
                            300: '#E6DCCF',
                            400: '#D5C4AF',
                            500: '#AC8F65',
                            600: '#8E734E',
                            700: '#162E24', /* Emerald Accent */
                            dark: '#151413'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- React & Babel Engines for Premium Interactive Features -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Schema.org Hotel Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Hotel",
      "name": "The Thomas Inn",
      "image": "images/hero_cover.jpg",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Fort Kochi",
        "addressRegion": "Kerala",
        "addressCountry": "IN"
      }
    }
    </script>
</head>
<body class="bg-[#FCFBF9] text-luxury-dark font-sans-luxury overflow-x-hidden antialiased">

    <!-- Container for mounting React -->
    <div id="root"></div>

    <!-- Interactive React Application -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [scrolled, setScrolled] = useState(false);
            const [bookingOpen, setBookingOpen] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div className="relative">
                    <header className={`fixed top-0 left-0 right-0 z-40 transition-all duration-500 ${scrolled ? 'glass-nav shadow-lg py-3' : 'bg-transparent py-5'}`}>
                        <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                            <span className="font-serif-luxury text-xl font-bold tracking-widest">THE THOMAS INN</span>
                            <button onClick={() => setBookingOpen(true)} className="bg-luxury-dark text-white text-xs font-bold px-6 py-3 rounded-full">BOOK NOW</button>
                        </div>
                    </header>

                    <section id="home" className="h-screen flex items-center justify-center bg-luxury-dark text-white p-6">
                        <div className="text-center space-y-6">
                            <h1 className="text-5xl font-serif-luxury font-light">The Thomas Inn</h1>
                            <p className="text-xl italic">A heritage resort in the heart of Fort Kochi.</p>
                        </div>
                    </section>

                    <section id="about" className="py-24 max-w-5xl mx-auto px-6 text-center">
                        <h2 className="text-3xl font-serif-luxury mb-8">Our Heritage</h2>
                        <p className="text-luxury-600 leading-relaxed">The Thomas Inn is a resort hotel located in the historic Fort Kochi area of Ernakulam. It offers a blend of colonial-era charm and modern amenities. The property is situated near iconic landmarks and the scenic Kochi waterfront.</p>
                    </section>

                    {bookingOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50">
                            <div className="bg-white rounded-3xl p-8 max-w-lg w-full">
                                <h3 className="text-xl font-serif-luxury mb-4">Reservation Enquiry</h3>
                                <form className="space-y-4" onSubmit={(e) => {e.preventDefault(); setBookingOpen(false);}}>
                                    <input type="text" placeholder="Name" className="w-full border p-3 rounded-lg" />
                                    <input type="text" placeholder="Requirements" className="w-full border p-3 rounded-lg" />
                                    <button className="w-full bg-luxury-dark text-white py-4 rounded-xl">SEND ENQUIRY</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
