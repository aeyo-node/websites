<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>

    <meta name="description" content="Experience luxury at Hotel Signature Cochin, a resort hotel in Ernakulam offering comfortable rooms, top-notch amenities, and a convenient location. Book now and enjoy a memorable stay.">

    <!-- Open Graph tags -->

    <script>
        tailwind.config = {\n            theme: {\n                extend: {\n                    colors: {\n                        luxury: {\n                            50: '#FCFBF9',\n                            100: '#FAF5EE',\n                            200: '#F4ECE1',\n                            300: '#E6DCCF',\n                            400: '#D5C4AF',\n                            500: '#AC8F65',\n                            600: '#8E734E',\n                            700: '#162E24', /* Emerald Accent */\n                            dark: '#151413'\n                        }\n                    }\n                }\n            }\n        }\n    </script>
    
    <!-- React & Babel Engines for Premium Interactive Features -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Schema.org Hotel Structured Data for Google search trust -->

    {
      "@context": "https://schema.org",
      "@type": "Hotel",
      "name": "Hotel Signature Cochin",
      "image": "images/hero_cover.jpg",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Ernakulam",
        "addressLocality": "Ernakulam",
        "addressRegion": "Kerala",
        "addressCountry": "IN"
      },
      "telephone": "(available upon request)",
      "starRating": {
        "@type": "Rating",
        "ratingValue": "4.5"
      },
      "priceRange": "Contact for pricing",
      "amenityFeature": [
        "Free Wi-Fi",
        "Air Conditioning",
        "Fitness center",
        "Outdoor pool",
        "Business center",
        "24x7 Room Service"
      ]
    }
    </script>
</head>
<body class="bg-[#FCFBF9] text-luxury-dark font-sans-luxury overflow-x-hidden antialiased">

    <!-- Container for mounting React -->
    <div id="root"></div>

    <!-- Interactive React Application -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        // Custom Premium SVG Icons representing clean luxury
        const Icons = {\n            Wifi: () => <svg className=\"w-5 h-5 text-luxury-500\" fill=\"none\" stroke=\"currentColor\" strokeWidth=\"2\" viewBox=\"0 0 24 24\"><path strokeLinecap=\"round\" strokeLinejoin=\"round\" d=\"M8.25 15.625a3.75 3.75 0 117.5 0M4.5 11.875a8.25 8.25 0 1115 0m-18.75-3.75a12.75 12.75 0 1122.5 0M12 18.75h.007v.008H12v-.008z\"/></svg>,\n            AC: () => <svg className=\"w-5 h-5 text-luxury-500\" fill=\"none\" stroke=\"currentColor\" strokeWidth=\"2\" viewBox=\"0 0 24 24\"><path strokeLinecap=\"round\" strokeLinejoin=\"round\" d=\"M3.75 4.875c0-.621.504-1.125 1.125-1.125h14.25c.621 0 1.125.504 1.125 1.125v14.25c0 .621-.504 1.125-1.125 1.125H4.875c-.621 0-1.125-.504-1.125-1.125V4.875zM12 9.75v4.5m-3-2.25h6m-11.25 6h16.5\"/></svg>,\n            Utensils: () => <svg className=\"w-5 h-5 text-luxury-500\" fill=\"none\" stroke=\"currentColor\" strokeWidth=\"2\" viewBox=\"0 0 24 24\"><path strokeLinecap=\"round\" strokeLinejoin=\"round\" d=\"M12 6.75a.75.75 0 110-1.5.75.75 0 010 1.5zm0 9a.75.75 0 110-1.5.75.75 0 010 1.5zM21 12a9 9 0 11-18 0 9 9 0 0118 0z\"/></svg>,\n            Bell: () => <svg className=\"w-5 h-5 text-luxury-500\" fill=\"none\" stroke=\"currentColor\" strokeWidth=\"2\" viewBox=\"0 0 24 24\"><path strokeLinecap=\"round\" strokeLinejoin=\"round\" d=\"M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a3 3 0 11-5.714 0m5.714 0a3 3 0 11-5.714 0\"/></svg>,\n            MapPin: () => <svg className=\"w-5 h-5\" fill=\"none\" stroke=\"currentColor\" strokeWidth=\"2\" viewBox=\"0 0 24 24\"><path strokeLinecap=\"round\" strokeLinejoin=\"round\" d=\"M15 10.5a3 3 0 11-6 0 3 3 0 016 0z\"/><path strokeLinecap=\"round\" strokeLinejoin=\"round\" d=\"M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z\"/></svg>,\n            Phone: () => <svg className=\"w-5 h-5\" fill=\"none\" stroke=\"currentColor\" strokeWidth=\"2\" viewBox=\"0 0 24 24\"><path strokeLinecap=\"round\" strokeLinejoin=\"round\" d=\"M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.387a12.035 12.035 0 01-7.108-7.108c-.115-.441.017-.928.393-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z\"/></svg>,\n            Award: () => <svg className=\"w-5 h-5 text-luxury-500\" fill=\"none\" stroke=\"currentColor\" strokeWidth=\"2\" viewBox=\"0 0 24 24\"><path strokeLinecap=\"round\" strokeLinejoin=\"round\" d=\"M16.5 18.75h-9m9 0a3 3 0 013 3h-15a3 3 0 013-3m9 0v-3.375c0-.621-.504-1.125-1.125-1.125h-6.75a1.125 1.125 0 00-1.125 1.125v3.375m9 0h-9M9 10.5h.008v.008H9V10.5zm3 0h.008v.008H12V10.5zm3 0h.008v.008H15V10.5z\"/></svg>,\n            Sparkles: () => <svg className=\"w-5 h-5 text-luxury-500\" fill=\"none\" stroke=\"currentColor\" strokeWidth=\"2\" viewBox=\"0 0 24 24\"><path strokeLinecap=\"round\" strokeLinejoin=\"round\" d=\"M9.813 15.904L9 21l-.813-5.096L3.096 15.1l5.096-.813L9 9.187l.813 5.096 5.096.813-5.096.813zM19.031 3l-.406 2.531-2.53 1.015 2.53 1.016L19.031 10.1l.407-2.532 2.53-1.015-2.53-1.016L19.031 3z\"/></svg>,\n            ChevronRight: () => <svg className=\"w-4 h-4\" fill=\"none\" stroke=\"currentColor\" strokeWidth=\"2\" viewBox=\"0 0 24 24\"><path strokeLinecap=\"round\" strokeLinejoin=\"round\" d=\"M8.25 4.5l7.5 7.5-7.5 7.5\"/></svg>,\n            Clock: () => <svg className=\"w-5 h-5\" fill=\"none\" stroke=\"currentColor\" strokeWidth=\"2\" viewBox=\"0 0 24 24\"><path strokeLinecap=\"round\" strokeLinejoin=\"round\" d=\"M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z\"/></svg>,\n            Star: () => <svg className=\"w-5 h-5 text-amber-400 fill-amber-400\" fill=\"currentColor\" viewBox=\"0 0 20 20\"><path d=\"M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z\"/></svg>,\n            X: () => <svg className=\"w-6 h-6\" fill=\"none\" stroke=\"currentColor\" strokeWidth=\"2\" viewBox=\"0 0 24 24\"><path strokeLinecap=\"round\" strokeLinejoin=\"round\" d=\"M6 18L18 6M6 6l12 12\"/></svg>,\n            Menu: () => <svg className=\"w-6 h-6\" fill=\"none\" stroke=\"currentColor\" strokeWidth=\"2\" viewBox=\"0 0 24 24\"><path strokeLinecap=\"round\" strokeLinejoin=\"round\" d=\"M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5\"/></svg>,\n            ArrowUpRight: () => <svg className=\"w-4 h-4 ml-1\" fill=\"none\" stroke=\"currentColor\" strokeWidth=\"2.5\" viewBox=\"0 0 24 24\"><path strokeLinecap=\"round\" strokeLinejoin=\"round\" d=\"M4.5 19.5l15-15m0 0H8.25m11.25 0v11.25\"/></svg>\n        };\n\n        function App() {\n            const [scrolled, setScrolled] = useState(false);\n            const [mobileNavOpen, setMobileNavOpen] = useState(false);\n            const [bookingOpen, setBookingOpen] = useState(false);\n            const [reviewIdx, setReviewIdx] = useState(0);\n            const [enquirySuccess, setEnquirySuccess] = useState(false);\n            const [lightboxOpen, setLightboxOpen] = useState(false);\n            const [lightboxImg, setLightboxImg] = useState('');\n            const [bookingForm, setBookingForm] = useState({ checkIn: '', checkOut: '', category: 'Standard Room', guests: '2', name: '', phone: '' });\n            const [bookingSuccess, setBookingSuccess] = useState(false);\n\n            useEffect(() => {\n                const handleScroll = () => { setScrolled(window.scrollY > 50); };\n                window.addEventListener('scroll', handleScroll);\n                return () => window.removeEventListener('scroll', handleScroll);\n            }, []);\n\n            const rooms = [\n                { id: 'standard', title: 'Standard Room', desc: 'Comfortable stay with premium amenities.', price: 'On Request', features: ['King Bed', 'Wi-Fi', 'Air Conditioning', 'Flat-screen TV'], image: 'images/room1.jpg' },\n                { id: 'deluxe', title: 'Deluxe Suite', desc: 'Spacious luxury with extra room.', price: 'On Request', features: ['King Bed', 'Coffee Maker', 'Minibar', 'Hair Dryer'], image: 'images/room3.jpg' }\n            ];\n\n            const reviews = [\n                { quote: \"Luxurious rooms and amazing amenities. Truly felt like a premium resort experience.\", author: \"Anonymous Guest\", role: \"Traveler\", rating: 5 },\n                { quote: \"Staff was incredibly attentive and welcoming. Great service.\", author: \"Anonymous Guest\", role: \"Business Trip\", rating: 5 },\n                { quote: \"Convenient location and a very comfortable stay overall.\", author: \"Anonymous Guest\", role: \"Vacationer\", rating: 5 }\n            ];\n\n            const gallery = [\n                { title: 'Lobby', desc: 'Elegant and welcoming entrance.', img: 'images/lobby.jpg' },\n                { title: 'Pool', desc: 'Relaxing outdoor pool area.', img: 'images/pool.jpg' },\n                { title: 'Fitness Center', desc: 'State-of-the-art gym equipment.', img: 'images/gym.jpg' }\n            ];\n\n            const submitBooking = (e) => { e.preventDefault(); setBookingSuccess(true); setTimeout(() => { setBookingSuccess(false); setBookingOpen(false); }, 4000); };\n\n            return (\n                <div className=\"relative\">\n                    <div className=\"bg-luxury-dark text-white/70 text-[10px] sm:text-xs py-2 px-6 flex justify-between items-center relative z-50 border-b border-white/5 tracking-wider\">\n                        <div className=\"flex gap-4 mx-auto sm:mx-0\">\n                            <span className=\"flex items-center gap-1\">📍 Ernakulam, Kerala</span>\n                        </div>\n                    </div>\n\n                    <header className={`fixed top-10 left-0 right-0 z-40 transition-all duration-500 max-w-7xl mx-auto px-4 ${scrolled ? 'top-2' : ''}`}>\n                        <div className={`rounded-3xl transition-all duration-500 ${scrolled ? 'glass-nav shadow-lg py-3 px-6' : 'bg-transparent py-5 px-4'}`}>\n                            <div className=\"flex items-center justify-between\">\n                                <a href=\"#home\" className=\"flex flex-col\">\n                                    <span className=\"font-serif-luxury text-xl sm:text-2xl font-bold tracking-widest text-luxury-dark\">\n                                        SIGNATURE COCHIN\n                                    </span>\n                                </a>\n                                <nav className=\"hidden lg:flex items-center space-x-8\">\n                                    {[{id:'home',label:'Home'},{id:'about',label:'About'},{id:'rooms',label:'Rooms'},{id:'amenities',label:'Amenities'},{id:'contact',label:'Contact'}].map(link => (\n                                        <a key={link.id} href={`#${link.id}`} className=\"text-xs uppercase tracking-widest font-semibold text-luxury-dark/80 hover:text-luxury-500\">{link.label}</a>\n                                    ))}\n                                </nav>\n                                <button onClick={() => setBookingOpen(true)} className=\"bg-luxury-dark hover:bg-luxury-700 text-white text-[10px] font-bold tracking-widest px-6 py-3 rounded-full transition-all\">RESERVE NOW</button>\n                            </div>\n                        </div>\n                    </header>\n\n                    <section id=\"home\" className=\"relative h-screen flex items-center justify-center overflow-hidden bg-luxury-dark\">\n                        <div className=\"absolute inset-0 select-none\">\n                            <img src=\"images/hero.jpg\" alt=\"Hotel Signature Cochin\" className=\"w-full h-full object-cover opacity-45\" />\n                        </div>\n                        <div className=\"max-w-5xl mx-auto px-6 text-center relative z-10 space-y-8 mt-20\">\n                            <h1 className=\"text-4xl sm:text-6xl lg:text-7xl font-serif-luxury text-white font-light\">Experience luxury in the heart of Ernakulam.</h1>\n                            <p className=\"text-sm sm:text-lg text-luxury-200/90 font-light\">Hotel Signature Cochin is a luxurious resort hotel offering comfortable accommodations and top-notch amenities.</p>\n                            <button onClick={() => setBookingOpen(true)} className=\"bg-luxury-100 hover:bg-white text-luxury-dark font-bold text-xs tracking-widest px-8 py-4.5 rounded-full\">BOOK YOUR STAY</button>\n                        </div>\n                    </section>\n\n                    <section id=\"about\" className=\"py-24 bg-[#FCFBF9]\">\n                        <div className=\"max-w-7xl mx-auto px-6\">\n                            <h2 className=\"text-3xl sm:text-5xl font-serif-luxury text-luxury-dark\">About Hotel Signature Cochin</h2>\n                            <p className=\"text-sm text-luxury-600 mt-6 leading-relaxed\">Strategically located in Ernakulam, we provide easy access to attractions and business hubs. Our resort hotel is designed to ensure a memorable stay for all guests.</p>\n                        </div>\n                    </section>\n\n                    <section id=\"rooms\" className=\"py-24 bg-luxury-100\">\n                        <div className=\"max-w-7xl mx-auto px-6\">\n                            <h2 className=\"text-3xl sm:text-5xl font-serif-luxury text-luxury-dark mb-16\">Our Rooms</h2>\n                            <div className=\"grid grid-cols-1 md:grid-cols-2 gap-8\">\n                                {rooms.map(room => (\n                                    <div key={room.id} className=\"bg-white p-8 rounded-3xl\">\n                                        <h3 className=\"text-2xl font-serif-luxury\">{room.title}</h3>\n                                        <p className=\"text-sm text-luxury-600 mt-2\">{room.desc}</p>\n                                        <button onClick={() => setBookingOpen(true)} className=\"mt-6 bg-luxury-dark text-white px-6 py-3 rounded-full text-xs\">BOOK NOW</button>\n                                    </div>\n                                ))}\n                            </div>\n                        </div>\n                    </section>\n\n                    <section id=\"amenities\" className=\"py-24 bg-luxury-dark text-white\">\n                        <div className=\"max-w-7xl mx-auto px-6\">\n                            <h2 className=\"text-3xl sm:text-5xl font-serif-luxury mb-16\">Amenities</h2>\n                            <div className=\"grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8\">\n                                {['24/7 Room Service', 'Fitness Center', 'Outdoor Pool', 'Business Center', 'Wi-Fi', 'Air Conditioning', 'Flat-screen TV', 'Minibar'].map((item, i) => (\n                                    <div key={i} className=\"glass-card-dark p-6 rounded-2xl border border-white/5\">\n                                        <h3 className=\"text-base font-bold\">{item}</h3>\n                                    </div>\n                                ))}\n                            </div>\n                        </div>\n                    </section>\n\n                    <section id=\"contact\" className=\"py-24 bg-white\">\n                        <div className=\"max-w-7xl mx-auto px-6\">\n                            <h2 className=\"text-3xl sm:text-5xl font-serif-luxury text-luxury-dark\">Contact Us</h2>\n                            <p className=\"mt-4\">Location: Ernakulam, Kerala</p>\n                        </div>\n                    </section>\n\n                    <footer className=\"bg-luxury-dark text-white/50 py-16\">\n                        <div className=\"max-w-7xl mx-auto px-6 text-center text-xs\">\n                            <p>© {new Date().getFullYear()} Hotel Signature Cochin. All Rights Reserved.</p>\n                        </div>\n                    </footer>\n\n                    {bookingOpen && (\n                        <div className=\"fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60\">\n                            <div className=\"bg-white rounded-3xl p-8 max-w-lg w-full\">\n                                <h3 className=\"text-xl font-bold mb-4\">Book Your Stay</h3>\n                                <form onSubmit={submitBooking} className=\"space-y-4\">\n                                    <input type=\"text\" placeholder=\"Name\" required className=\"w-full border rounded-xl p-3\" />\n                                    <input type=\"tel\" placeholder=\"Phone\" required className=\"w-full border rounded-xl p-3\" />\n                                    <button type=\"submit\" className=\"w-full bg-luxury-dark text-white p-3 rounded-xl\">Confirm Reservation</button>\n                                    <button onClick={() => setBookingOpen(false)} className=\"w-full mt-2 text-xs\">Close</button>\n                                </form>\n                            </div>\n                        </div>\n                    )}\n                </div>\n            );\n        }\n\n        const root = ReactDOM.createRoot(document.getElementById('root'));\n        root.render(<App />);\n    </script>\n</body>\n</html>
